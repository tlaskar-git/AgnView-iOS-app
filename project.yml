name: AgnView
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
packages:
  IrohLib:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "7"
targets:
  AgnView:
    type: application
    platform: iOS
    sources:
      - path: Sources/AgnView
    dependencies:
      - package: IrohLib
        product: IrohLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agnview
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/AgnView-Info.plist
    info:
      path: Config/AgnView-Info.plist
      properties:
        CFBundleDisplayName: AgnView
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.example.agnview
            CFBundleURLSchemes:
              - agnview
        NSCameraUsageDescription: Scan the pairing QR code shown in AgnView on your computer.
        NSLocalNetworkUsageDescription: AgnView connects to your computer on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AgnViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgnViewTests
    dependencies:
      - target: AgnView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agnview.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AgnView.app/AgnView"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AgnViewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgnViewUITests
    dependencies:
      - target: AgnView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agnview.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgnView
schemes:
  AgnView:
    build:
      targets:
        AgnView: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgnViewTests
        - AgnViewUITests
    archive:
      config: Release
