name: asc-tests

# Unit tests for Tools/asc. They use a fake HTTP layer, no secrets and no network.

on:
  pull_request:
  push:
    branches:
      - bot/p10-asc-automation

permissions:
  contents: read

concurrency:
  group: asc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asc-tool-tests:
    name: asc-tool-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install cryptography
        run: |
          set +x
          python -m pip install --quiet "cryptography==50.0.1"

      - name: Run the tests
        run: |
          set +x
          python -m unittest discover -s Tools/asc -v
