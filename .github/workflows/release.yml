name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit on main
        run: |
          set +x
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not an ancestor of origin/main. Refusing to release."
            exit 1
          fi

      - name: Check required secrets
        run: |
          set +x
          missing=0
          for name in APPLE_TEAM_ID APP_BUNDLE_ID APPLE_DISTRIBUTION_CERT_P12_BASE64 \
            APPLE_DISTRIBUTION_CERT_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 \
            APPLE_PROVISIONING_PROFILE_NAME ASC_API_KEY_ID ASC_API_ISSUER_ID \
            ASC_API_KEY_P8_BASE64; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All required secrets are present."
          for name in APPLE_TEAM_ID APP_BUNDLE_ID APPLE_PROVISIONING_PROFILE_NAME \
            ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            value="${!name}"
            echo "::add-mask::$value"
          done

      - name: Install XcodeGen
        run: |
          set +x
          brew install xcodegen

      - name: Generate project
        run: |
          set +x
          xcodegen generate

      - name: Decode signing material
        run: |
          set +x
          dir="$RUNNER_TEMP/release-secrets"
          mkdir -p "$dir"
          chmod 700 "$dir"
          echo "$APPLE_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$dir/cert.p12"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$dir/profile.mobileprovision"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$dir/api-key.p8"
          chmod 600 "$dir/cert.p12" "$dir/profile.mobileprovision" "$dir/api-key.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$dir/api-key.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Set up keychain and profile
        run: |
          set +x
          dir="$RUNNER_TEMP/release-secrets"
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$dir/cert.p12" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$dir/profile.mobileprovision" > "$dir/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$dir/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$dir/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set +x
          version="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -scheme AgnView \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AgnView.xcarchive" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export IPA
        run: |
          set +x
          plist="$RUNNER_TEMP/release-secrets/ExportOptions.plist"
          pb=/usr/libexec/PlistBuddy
          rm -f "$plist"
          "$pb" -c "Add :method string app-store-connect" "$plist"
          "$pb" -c "Add :teamID string $APPLE_TEAM_ID" "$plist"
          "$pb" -c "Add :signingStyle string manual" "$plist"
          "$pb" -c "Add :signingCertificate string Apple Distribution" "$plist"
          "$pb" -c "Add :provisioningProfiles dict" "$plist"
          "$pb" -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $APPLE_PROVISIONING_PROFILE_NAME" "$plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgnView.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$plist"
          ls "$RUNNER_TEMP/export"/*.ipa > /dev/null

      - name: Upload to TestFlight
        run: |
          set +x
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Clean up
        if: always()
        run: |
          set +x
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          rm -rf "$RUNNER_TEMP/release-secrets" "$RUNNER_TEMP/export" "$RUNNER_TEMP/AgnView.xcarchive"
