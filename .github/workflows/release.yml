name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit on main
        run: |
          set +x
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not an ancestor of origin/main. Refusing to release."
            exit 1
          fi

      # Shared steps (input and icon checks, project generation, signing,
      # archive, export). Nothing is uploaded here. The upload step follows.
      - name: Sign, archive and export
        uses: ./.github/actions/ios-sign-archive
        with:
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-bundle-id: ${{ secrets.APP_BUNDLE_ID }}
          cert-p12-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          profile-base64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          profile-name: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          asc-key-id: ${{ secrets.ASC_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          marketing-version: ${{ github.ref_name }}
          build-number: ${{ github.run_number }}

      - name: Upload to TestFlight
        run: |
          set +x
          set -o pipefail
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 \
            | python3 Tools/ci/redact_log.py

      - name: Clean up
        if: always()
        run: |
          set +x
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          rm -rf "$RUNNER_TEMP/release-secrets" "$RUNNER_TEMP/export" "$RUNNER_TEMP/AgnView.xcarchive"
