name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools-test:
    name: tools-test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test signing helpers
        run: |
          set +x
          python3 Tools/ci/test_cert_match.py
          python3 Tools/ci/test_redact_log.py

  build-test:
    name: build-test (${{ matrix.device }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          set +x
          brew install xcodegen

      - name: Generate project
        run: |
          set +x
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          set +x
          family="iPhone"
          if [ "${{ matrix.device }}" = "ipad" ]; then family="iPad"; fi
          udid="$(python3 Tools/ci/pick_sim.py "$family")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid" || true

      - name: Start mock hub
        run: |
          set +x
          nohup python3 Tools/mock-hub/mock_hub.py 18081 > "$RUNNER_TEMP/mock-hub.log" 2>&1 &

      - name: Check mock hub auth header
        run: |
          set +x
          python3 - <<'PY'
          import sys, time, urllib.error, urllib.request

          URL = "http://127.0.0.1:18081/api/mobile/status"
          VALUE = "test-key-not-real"

          def code(headers):
              req = urllib.request.Request(URL, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=3) as resp:
                      return resp.status
              except urllib.error.HTTPError as err:
                  return err.code
              except OSError:
                  return 0

          for _ in range(30):
              if code({"X-AgnView-Token": VALUE}) == 200:
                  break
              time.sleep(1)
          results = {
              "X-AgnView-Token": code({"X-AgnView-Token": VALUE}),
              "Bearer": code({"Authorization": "Bearer " + VALUE}),
              "none": code({}),
              "wrong": code({"X-AgnView-Token": "wrong-test-value"}),
          }
          print(results)
          expected = {"X-AgnView-Token": 200, "Bearer": 200, "none": 401, "wrong": 401}
          sys.exit(0 if results == expected else 1)
          PY

      - name: Resolve packages
        run: |
          set +x
          xcodebuild -resolvePackageDependencies -scheme AgnView

      - name: Build and test
        env:
          AGNVIEW_MOCK_HUB_URL: http://127.0.0.1:18081
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +x
          xcodebuild test \
            -scheme AgnView \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/result.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-"

      - name: Check built app version numbers
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +x
          want_version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml | head -1)"
          want_build="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml | head -1)"
          settings="$(xcodebuild -showBuildSettings -scheme AgnView -destination "platform=iOS Simulator,id=$UDID" 2>/dev/null)"
          dir="$(printf '%s\n' "$settings" | sed -n 's/^ *BUILT_PRODUCTS_DIR = //p' | head -1)"
          name="$(printf '%s\n' "$settings" | sed -n 's/^ *FULL_PRODUCT_NAME = //p' | head -1)"
          plist="$dir/$name/Info.plist"
          got_version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")"
          got_build="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")"
          echo "expected version=$want_version build=$want_build"
          echo "built    version=$got_version build=$got_build"
          if [ -z "$want_version" ] || [ -z "$want_build" ]; then
            echo "FAIL: could not read project defaults"
            exit 1
          fi
          case "$got_version$got_build" in
            *'$('*) echo "FAIL: unexpanded build setting in Info.plist"; exit 1 ;;
          esac
          if [ "$got_version" != "$want_version" ] || [ "$got_build" != "$want_build" ]; then
            echo "FAIL: built app version does not match project settings"
            exit 1
          fi
          echo "PASS"

      - name: Check the built app icon
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +x
          settings="$(xcodebuild -showBuildSettings -scheme AgnView -destination "platform=iOS Simulator,id=$UDID" 2>/dev/null)"
          dir="$(echo "$settings" | sed -n 's/^ *BUILT_PRODUCTS_DIR = //p' | head -1)"
          name="$(echo "$settings" | sed -n 's/^ *FULL_PRODUCT_NAME = //p' | head -1)"
          sh Tools/ci/check_built_icon.sh "$dir/$name" Sources/AgnView/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Export screenshots
        if: always()
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/shots"
          if [ -d "$RUNNER_TEMP/result.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/result.xcresult" \
              --output-path "$RUNNER_TEMP/attachments"
            python3 Tools/ci/export_screenshots.py "$RUNNER_TEMP/attachments" "$RUNNER_TEMP/shots" "${{ matrix.device }}"
          else
            echo "no result bundle found"
          fi
          ls -1 "$RUNNER_TEMP/shots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-screenshots-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/shots/*.png
            ${{ runner.temp }}/shots/summary.txt
          retention-days: 14
          if-no-files-found: warn

  iroh-loopback:
    name: iroh-loopback (optional)
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          set +x
          brew install xcodegen

      - name: Generate project
        run: |
          set +x
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          set +x
          udid="$(python3 Tools/ci/pick_sim.py iPhone)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Start iroh console server
        run: |
          set +x
          python3 -m venv "$RUNNER_TEMP/irohenv"
          "$RUNNER_TEMP/irohenv/bin/pip" install --quiet iroh==1.1.0
          nohup "$RUNNER_TEMP/irohenv/bin/python" Tools/mock-hub/mock_hub.py --iroh "$RUNNER_TEMP/iroh-ticket" > "$RUNNER_TEMP/iroh-server.log" 2>&1 &
          for i in $(seq 1 60); do
            if [ -s "$RUNNER_TEMP/iroh-ticket" ]; then echo "iroh server ready"; break; fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/iroh-ticket"

      - name: Test IrohTransport against the server
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +x
          TEST_RUNNER_AGNVIEW_IROH_TICKET="$(cat "$RUNNER_TEMP/iroh-ticket")"
          export TEST_RUNNER_AGNVIEW_IROH_TICKET
          status=0
          xcodebuild test \
            -scheme AgnView \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:AgnViewTests/TransportTests/testIrohLoopbackConsole \
            -only-testing:AgnViewTests/TransportTests/testIrohLoopbackWrongToken \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/iroh-test.log" 2>&1 || status=$?
          grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)" "$RUNNER_TEMP/iroh-test.log" || true
          test "$status" = "0"
          grep -q "testIrohLoopbackConsole\]' passed" "$RUNNER_TEMP/iroh-test.log"
          grep -q "testIrohLoopbackWrongToken\]' passed" "$RUNNER_TEMP/iroh-test.log"
