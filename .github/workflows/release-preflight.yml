name: release-preflight

# Manual signing preflight. Runs the release steps up to and including export,
# then validates the IPA with App Store Connect. It uploads nothing and it
# publishes no artifact. The "release" environment requires approval per run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign, archive and export
        uses: ./.github/actions/ios-sign-archive
        with:
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-bundle-id: ${{ secrets.APP_BUNDLE_ID }}
          cert-p12-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          profile-base64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          profile-name: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          asc-key-id: ${{ secrets.ASC_API_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          asc-key-p8-base64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          marketing-version: "0.1.0"
          build-number: ${{ github.run_number }}

      - name: Validate with App Store Connect (no upload)
        run: |
          set +x
          set -o pipefail
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 \
            | python3 Tools/ci/redact_log.py

      - name: Clean up
        if: always()
        run: |
          set +x
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          rm -rf "$RUNNER_TEMP/release-secrets" "$RUNNER_TEMP/export" "$RUNNER_TEMP/AgnView.xcarchive"
