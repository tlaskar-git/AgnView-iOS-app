name: iOS sign and archive
description: Check release inputs, sign, archive and export an IPA. Never uploads anything.

inputs:
  apple-team-id:
    description: Apple team ID
    required: true
  app-bundle-id:
    description: App bundle identifier
    required: true
  cert-p12-base64:
    description: Distribution certificate, base64
    required: true
  cert-password:
    description: Distribution certificate password
    required: true
  profile-base64:
    description: Provisioning profile, base64
    required: true
  profile-name:
    description: Provisioning profile name
    required: true
  asc-key-id:
    description: App Store Connect API key ID
    required: true
  asc-issuer-id:
    description: App Store Connect API issuer ID
    required: true
  asc-key-p8-base64:
    description: App Store Connect API key, base64
    required: true
  marketing-version:
    description: Marketing version for the archive
    required: true
  build-number:
    description: Build number for the archive
    required: true

runs:
  using: composite
  steps:
    - name: Mask derived values
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APP_BUNDLE_ID: ${{ inputs.app-bundle-id }}
        APPLE_PROVISIONING_PROFILE_NAME: ${{ inputs.profile-name }}
        ASC_API_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_API_ISSUER_ID: ${{ inputs.asc-issuer-id }}
      run: |
        set +x
        for name in APPLE_TEAM_ID APP_BUNDLE_ID APPLE_PROVISIONING_PROFILE_NAME \
          ASC_API_KEY_ID ASC_API_ISSUER_ID; do
          value="${!name}"
          if [ -n "$value" ]; then echo "::add-mask::$value"; fi
        done

    - name: Check release inputs
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APP_BUNDLE_ID: ${{ inputs.app-bundle-id }}
        APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ inputs.cert-password }}
        APPLE_PROVISIONING_PROFILE_BASE64: ${{ inputs.profile-base64 }}
        APPLE_PROVISIONING_PROFILE_NAME: ${{ inputs.profile-name }}
        ASC_API_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_API_ISSUER_ID: ${{ inputs.asc-issuer-id }}
        ASC_API_KEY_P8_BASE64: ${{ inputs.asc-key-p8-base64 }}
      run: |
        set +x
        sh Tools/ci/check_release_inputs.sh

    - name: Check app icon
      shell: bash
      run: |
        set +x
        python3 Tools/ci/check_icon.py Sources/AgnView/Assets.xcassets/AppIcon.appiconset/AppIcon.png

    - name: Install XcodeGen
      shell: bash
      run: |
        set +x
        brew install xcodegen

    - name: Generate project
      shell: bash
      run: |
        set +x
        xcodegen generate

    - name: Decode signing material
      shell: bash
      env:
        APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ inputs.cert-p12-base64 }}
        APPLE_PROVISIONING_PROFILE_BASE64: ${{ inputs.profile-base64 }}
        ASC_API_KEY_P8_BASE64: ${{ inputs.asc-key-p8-base64 }}
        ASC_API_KEY_ID: ${{ inputs.asc-key-id }}
      run: |
        set +x
        dir="$RUNNER_TEMP/release-secrets"
        mkdir -p "$dir"
        chmod 700 "$dir"
        printf '%s' "$APPLE_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$dir/cert.p12"
        printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$dir/profile.mobileprovision"
        printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$dir/api-key.p8"
        chmod 600 "$dir/cert.p12" "$dir/profile.mobileprovision" "$dir/api-key.p8"
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        cp "$dir/api-key.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
        chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

    - name: Set up keychain and profile
      shell: bash
      env:
        APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ inputs.cert-password }}
      run: |
        set +x
        dir="$RUNNER_TEMP/release-secrets"
        keychain="$RUNNER_TEMP/release.keychain-db"
        keychain_password="$(openssl rand -base64 32)"
        echo "::add-mask::$keychain_password"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 7200 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$dir/cert.p12" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" \
          -A -t cert -f pkcs12 -k "$keychain" > /dev/null
        security set-key-partition-list -S apple-tool:,apple: -s \
          -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" login.keychain-db
        security cms -D -i "$dir/profile.mobileprovision" > "$dir/profile.plist"
        profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$dir/profile.plist")"
        echo "::add-mask::$profile_uuid"
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$dir/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
        echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
        echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

    - name: Check profile consistency
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APP_BUNDLE_ID: ${{ inputs.app-bundle-id }}
        APPLE_PROVISIONING_PROFILE_NAME: ${{ inputs.profile-name }}
      run: |
        set +x
        sh Tools/ci/check_profile.sh "$RUNNER_TEMP/release-secrets/profile.mobileprovision" "$KEYCHAIN_PATH"

    - name: Archive
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APP_BUNDLE_ID: ${{ inputs.app-bundle-id }}
        APPLE_PROVISIONING_PROFILE_NAME: ${{ inputs.profile-name }}
        MARKETING_VERSION_INPUT: ${{ inputs.marketing-version }}
        BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
      run: |
        set +x
        version="${MARKETING_VERSION_INPUT#v}"
        xcodebuild archive \
          -scheme AgnView \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath "$RUNNER_TEMP/AgnView.xcarchive" \
          MARKETING_VERSION="$version" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER_INPUT" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME" \
          PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
          OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

    - name: Export IPA
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
        APP_BUNDLE_ID: ${{ inputs.app-bundle-id }}
        APPLE_PROVISIONING_PROFILE_NAME: ${{ inputs.profile-name }}
      run: |
        set +x
        plist="$RUNNER_TEMP/release-secrets/ExportOptions.plist"
        pb=/usr/libexec/PlistBuddy
        rm -f "$plist"
        "$pb" -c "Add :method string app-store-connect" "$plist"
        "$pb" -c "Add :teamID string $APPLE_TEAM_ID" "$plist"
        "$pb" -c "Add :signingStyle string manual" "$plist"
        "$pb" -c "Add :signingCertificate string Apple Distribution" "$plist"
        "$pb" -c "Add :provisioningProfiles dict" "$plist"
        "$pb" -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $APPLE_PROVISIONING_PROFILE_NAME" "$plist"
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/AgnView.xcarchive" \
          -exportPath "$RUNNER_TEMP/export" \
          -exportOptionsPlist "$plist"
        ls "$RUNNER_TEMP/export"/*.ipa > /dev/null
